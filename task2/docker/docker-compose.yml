services:

  proxy:
    container_name: nginxProxy
    image: nginx:alpine
    ports:
      - "8080:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ > /dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        reservations:
          cpus: '0.1'
          memory: 64M
        limits:
          cpus: '0.25'
          memory: 128M
    restart: always
    volumes:
      - ../nginx/nginx-proxy.conf:/etc/nginx/conf.d/default.conf:ro
    logging:
      driver: "local"
    networks:
      - proxy-frontend-network
    depends_on:
      frontend:
        condition: service_healthy
  frontend:
    container_name: frontendContainer
    build:
      context: ..
      dockerfile: docker/Dockerfile.frontend
    env_file: ../env/frontend.env
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ > /dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        reservations:
          cpus: '0.1'
          memory: 64M
        limits:
          cpus: '0.25'
          memory: 128M
    restart: unless-stopped
    logging:
      driver: "local"
    networks:
      - proxy-frontend-network
      - frontend-backend-network
    depends_on:
      backend:
        condition: service_healthy
  backend:
    container_name: backendContainer
    build:
      context: ..
      dockerfile: docker/Dockerfile.backend
    expose:
      - "3000"
    env_file: ../env/backend.env
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:3000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        reservations:
          cpus: '0.50'
          memory: 256M
        limits:
          cpus: '1.0'
          memory: 512M 
    restart: unless-stopped
    logging:
      driver: "local"
    networks:
      - frontend-backend-network
      - backend-db-network
    depends_on:
      db:
        condition: service_healthy
  db:
    container_name: pgContainer
    image: postgres:17-alpine
    env_file: ../env/backend.env
    ports:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
        resources:
          reservations:
            cpus: '0.5'
            memory: 512M
          limits:
            cpus: '1.0'
            memory: 1024M
    logging:
      driver: "local"
    restart: always
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - backend-db-network

volumes:
  pgdata:
networks:
  proxy-frontend-network:
    driver: bridge
  frontend-backend-network:
    driver: bridge
  backend-db-network:
    driver: bridge
    